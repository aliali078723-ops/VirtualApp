name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 17 for NDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install NDK and Accept Licenses
      run: |
        yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true
        ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "ndk;21.4.7075529"
        echo "ndk.dir=${ANDROID_SDK_ROOT}/ndk/21.4.7075529" >> local.properties

    - name: Switch to Java 8 for Gradle
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Project with Gradle
      run: ./gradlew build -x test

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: virtualapp-apks
        path: '**/build/outputs/apk/**/*.apk'
